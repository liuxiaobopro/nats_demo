services:
  nats:
    image: nats:2.10-alpine  # 轻量级 Alpine 镜像
    container_name: nats-server
    restart: unless-stopped
    ports:
      - "4222:4222"    # 客户端连接端口
      - "8222:8222"    # Web 监控面板端口
      - "6222:6222"    # 集群通信端口（单节点可省略）
    command:
      - "--http_port=8222"  # 启用监控面板
      - "--jetstream"        # 启用持久化消息（JetStream）
    volumes:
      - ./nats-data:/data    # 消息数据持久化
    networks:
      - nats-network

networks:
  nats-network:
    driver: bridge